<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Perfil del Voluntario</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Montserrat,sans-serif;background:#f5f5f5;color:#333;}
  header{background:#d71920;color:white;padding:25px;text-align:center;}
  .container{width:90%;max-width:700px;margin:30px auto;background:white;padding:35px;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.10);}
  h2{border-bottom:2px solid #eee;padding-bottom:8px;margin:20px 0 15px;font-size:16px;color:#d71920;}
  .mensaje{padding:14px 20px;border-radius:8px;margin-bottom:20px;font-weight:600;background:#dff5df;color:#1b7a1b;text-align:center;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
  .full{grid-column:span 2;}
  label{display:block;margin:8px 0 4px;font-weight:600;font-size:13px;color:#555;}
  input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:inherit;}
  input[readonly]{background:#e9ecef;color:#6c757d;cursor:not-allowed;}
  .acciones{margin-top:25px;display:flex;gap:12px;}
  button,a.btn-volver{flex:1;text-align:center;padding:12px;border:none;border-radius:8px;font-weight:bold;text-decoration:none;cursor:pointer;}
  button{background:#d71920;color:white;}
  button:hover{background:#b51319;}
  a.btn-volver{background:#6c757d;color:white;}
  a.btn-volver:hover{background:#5a6268;}
</style>
</head>
<body>

<header>
  <h1>Perfil del Voluntario</h1>
</header>

<div class="container">
  <div th:if="${mensajeExito}" class="mensaje" th:text="${mensajeExito}"></div>

  <form th:action="@{/postulantes/{id}/perfil(id=${postulacion.id})}" method="post">
    
    <h2>Datos Personales</h2>
    <div class="grid">
      <div>
        <label>DNI (No editable)</label>
        <input type="text" th:value="${voluntario.dni}" readonly>
      </div>
      <div>
        <label>Nombre Completo (No editable)</label>
        <input type="text" th:value="${voluntario.nombreCompleto}" readonly>
      </div>
      <div>
        <label>Correo Electrónico</label>
        <input type="email" name="correo" th:value="${voluntario.correo}" placeholder="ejemplo@correo.com">
      </div>
      <div>
        <label>Teléfono</label>
        <input type="text" name="telefono" th:value="${voluntario.telefono}" placeholder="987654321">
      </div>
      <div class="full">
        <label>Dirección</label>
        <input type="text" name="direccion" th:value="${voluntario.direccion}" placeholder="Av. Principal 123">
      </div>
      <div class="full">
        <label>Disponibilidad *</label>
        <input type="text" name="disponibilidad" th:value="${voluntario.disponibilidad}" required>
      </div>
    </div>

    <h2>Datos Académicos y Formación</h2>
    <div class="grid">
      <div>
        <label>Nivel de Formación *</label>
        <input type="text" name="nivelFormacion" th:value="${voluntario.perfil != null ? voluntario.perfil.nivelFormacion : ''}" required>
      </div>
      <div>
        <label>Especialidad *</label>
        <input type="text" name="especialidad" th:value="${voluntario.perfil != null ? voluntario.perfil.especialidad : ''}" required>
      </div>
      <div class="full">
        <label>Habilidades (separadas por coma) *</label>
        <input type="text" name="habilidades" th:value="${habilidadesString}" required>
      </div>
    </div>

    <div class="acciones">
      <a th:href="@{/postulantes}" class="btn-volver">Volver a Postulantes</a>
      <button type="submit">Guardar Cambios</button>
    </div>
  </form>
</div>

</body>
</html>
