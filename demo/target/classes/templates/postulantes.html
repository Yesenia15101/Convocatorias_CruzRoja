<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Postulantes Registrados</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Montserrat,sans-serif;background:#f5f5f5;color:#333;}
header{background:#d71920;color:white;padding:30px;text-align:center;}
.container{width:90%;max-width:1000px;margin:40px auto;}
.mensaje{padding:16px 22px;border-radius:10px;margin-bottom:20px;font-weight:600;}
.exito{background:#dff5df;color:#1b7a1b;}
.error{background:#ffdada;color:#b10000;}
table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.08);}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid #eee;font-size:14px;}
th{background:#d71920;color:white;}
a.boton{display:inline-block;margin-bottom:20px;background:#d71920;color:white;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<header><h1>Postulantes Registrados</h1></header>
<div class="container">
  <div th:if="${mensajeExito}" class="mensaje exito" th:text="${mensajeExito}"></div>
  <div th:if="${mensajeError}" class="mensaje error" th:text="${mensajeError}"></div>

  <a class="boton" th:href="@{/postulantes/nuevo}">+ Registrar nuevo postulante</a>

  <table>
    <tr><th>Nombre</th><th>DNI</th><th>Especialidad</th><th>Habilidades</th><th>Estado</th><th>Fecha</th></tr>
    <tr th:each="p : ${postulantes}">
      <td th:text="${p.voluntario.nombreCompleto}"></td>
      <td th:text="${p.voluntario.dni}"></td>
      <td th:text="${p.voluntario.perfil.especialidad}"></td>
      <td th:text="${#strings.listJoin(p.voluntario.perfil.habilidades, ', ')}"></td>
      <td th:text="${p.estado.descripcion}"></td>
      <td th:text="${#temporals.format(p.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
    </tr>
  </table>
</div>
</body>
</html>
