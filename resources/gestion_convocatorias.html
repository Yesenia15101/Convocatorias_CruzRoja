<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestionar convocatorias</title>
<style>
:root{font-family:Arial,sans-serif;background:#f5f5f5;color:#292929}*{box-sizing:border-box}body{margin:0}header{background:#d71920;color:#fff;padding:24px 5%}header div{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}a{color:inherit}
main{max-width:1200px;margin:25px auto;padding:0 18px}.layout{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 14px #0001}
label{display:block;font-weight:bold;margin-top:10px}input,textarea{width:100%;padding:9px;margin-top:4px;border:1px solid #bbb;border-radius:7px}button{border:0;border-radius:7px;padding:10px 13px;background:#d71920;color:#fff;font-weight:bold;cursor:pointer}.full{width:100%;margin-top:15px}.secondary{background:#555}.danger{background:#9e1116}
.card{border:1px solid #ddd;border-radius:9px;padding:15px;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.message{padding:10px;border-radius:7px;margin-bottom:12px;background:#fff0d0}.tags span{display:inline-block;background:#eee;padding:5px 8px;margin:3px;border-radius:12px;font-size:13px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="sistema.css">
</head><body><header><div><div><h1>Gestión de convocatorias</h1><p>Publicar, editar, eliminar y seleccionar voluntarios</p></div><a href="/main.html" onclick="window.location.replace('/main.html');return false">← Volver directamente al inicio</a></div></header>
<main><p id="message" class="message">Cargando...</p><div class="layout"><section class="panel"><h2 id="formTitle">Publicar convocatoria</h2><form id="form">
<label>Código<input name="codigo" id="codigo" required></label><label>Título<input name="titulo" required></label>
<label>Fecha<input name="fecha" type="date" required></label><label>Hora de inicio<input name="horaInicio" type="time" required></label><label>Hora final<input name="horaFin" type="time" required></label>
<label>Ubicación<input name="ubicacion" required></label><label>Requisitos<textarea name="requisitosTexto" required placeholder="Separados por comas"></textarea></label>
<label>Cantidad mínima<input name="minimoParticipantes" type="number" min="1" required></label><button class="full">Guardar convocatoria</button><button type="button" id="cancel" class="full secondary">Cancelar edición</button>
</form></section><section class="panel"><h2>Convocatorias publicadas</h2><div id="list"></div><h2>Voluntarios compatibles</h2><div id="compatible">Selecciona “Filtrar voluntarios” en una convocatoria.</div></section></div></main>
<script>
let editing=null,calls=[];const message=document.querySelector("#message"),form=document.querySelector("#form");
async function req(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||b.error||"Operación fallida");return b}
function payload(){const d=Object.fromEntries(new FormData(form));return {...d,minimoParticipantes:Number(d.minimoParticipantes),requisitos:d.requisitosTexto.split(",").map(x=>x.trim()).filter(Boolean)}}
async function load(){calls=await req("/api/convocatorias");list.innerHTML=calls.map(c=>`<article class="card"><b>${c.nombre}</b> · ${c.estado.replaceAll("_"," ")}<p>📅 ${c.fechaServicio} · 🕒 ${c.horaInicio||"Sin horario"}–${c.horaFinalizacion||""} · 📍 ${c.lugar}</p><div class="tags">${c.requisitos.map(r=>`<span>${r}</span>`).join("")}</div><p>Mínimo ${c.minimoParticipantes} · inscritos ${c.inscritosActuales}</p><div class="actions"><button onclick="edit('${c.codigo}')">Editar</button><button onclick="filterPeople('${c.codigo}')">Filtrar voluntarios</button><button class="danger" onclick="removeCall('${c.codigo}','${c.nombre.replaceAll("'","")}')">Eliminar</button></div></article>`).join("");message.textContent="Información actualizada."}
form.onsubmit=async e=>{e.preventDefault();try{const p=payload();await req(editing?`/api/convocatorias/${editing}`:"/api/convocatorias",{method:editing?"PUT":"POST",body:JSON.stringify(p)});reset();await load();message.textContent=editing?"Cambios guardados.":"Convocatoria publicada."}catch(x){message.textContent=x.message}};
function edit(code){const c=calls.find(x=>x.codigo===code);editing=code;formTitle.textContent="Editar convocatoria";codigo.value=c.codigo;codigo.disabled=true;form.titulo.value=c.nombre;form.fecha.value=c.fechaServicio;form.horaInicio.value=c.horaInicio||"";form.horaFin.value=c.horaFinalizacion||"";form.ubicacion.value=c.lugar;form.requisitosTexto.value=c.requisitos.join(", ");form.minimoParticipantes.value=c.minimoParticipantes;scrollTo({top:0,behavior:"smooth"})}
function reset(){editing=null;form.reset();codigo.disabled=false;formTitle.textContent="Publicar convocatoria"} cancel.onclick=reset;
async function removeCall(code,name){if(!confirm(`¿Eliminar la convocatoria “${name}”? Esta acción no se puede deshacer.`))return;try{await req(`/api/convocatorias/${code}`,{method:"DELETE"});await load();message.textContent="Convocatoria eliminada y listado actualizado."}catch(x){message.textContent=x.message}}
async function filterPeople(code){try{const people=await req(`/api/perfiles/compatibles?convocatoria=${encodeURIComponent(code)}`);compatible.innerHTML=people.length?people.map(p=>`<div class="card"><b>${p.nombre}</b> — ${p.nivelFormacion}<br>${p.especialidad}<div class="tags">${p.habilidades.map(h=>`<span>${h}</span>`).join("")}</div></div>`).join(""):"No se encontraron perfiles compatibles."}catch(x){message.textContent=x.message}}
load().catch(x=>message.textContent=x.message);
</script></body></html>
