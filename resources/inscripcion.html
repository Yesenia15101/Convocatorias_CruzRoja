<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscribirme</title><style>:root{font-family:Arial,sans-serif;background:#f5f5f5}body{margin:0}header{background:#d71920;color:#fff;padding:24px 6%}header div,main{max-width:760px;margin:auto}header div{display:flex;justify-content:space-between}a{color:inherit}main{padding:25px 18px}.panel{background:#fff;padding:22px;border-radius:12px}label{display:block;font-weight:bold;margin:12px 0}input,select,textarea{width:100%;padding:10px;margin-top:5px;box-sizing:border-box}button{padding:12px;background:#d71920;color:#fff;border:0;border-radius:7px;font-weight:bold;width:100%}</style><link rel="stylesheet" href="sistema.css">
</head><body><header><div><div><h1>Inscripción a voluntariado</h1><p>Completa los datos para enviar tu solicitud.</p></div><a href="main.html">← Inicio</a></div></header><main><p id="message"></p><form id="form" class="panel"><label>Nombre<input name="nombre" required></label><label>DNI<input name="dni" required></label><label>Correo<input name="correo" type="email" required></label><label>Teléfono<input name="telefono" required></label><label>Convocatoria<select name="codigoConvocatoria" id="calls" required></select></label><label>Experiencia<textarea name="experiencia" required></textarea></label><button>Enviar inscripción</button></form></main><script>
let data=[];async function req(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||b.detail||"Operación fallida");return b}async function load(){data=await req("/api/convocatorias/disponibles");calls.innerHTML=data.map(c=>`<option value="${c.codigo}">${c.nombre}</option>`).join("");const selected=new URLSearchParams(location.search).get("convocatoria");if(selected)calls.value=selected}form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form)),c=data.find(x=>x.codigo===d.codigoConvocatoria);try{await req("/api/inscripciones",{method:"POST",body:JSON.stringify({...d,convocatoria:c.nombre})});form.reset();message.textContent="Inscripción registrada. Ya puedes consultar su estado."}catch(x){message.textContent=x.message}};load().catch(x=>message.textContent=x.message);</script></body></html>
