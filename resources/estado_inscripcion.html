<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado de inscripción</title><style>:root{font-family:Arial,sans-serif;background:#f5f5f5}body{margin:0}header{background:#d71920;color:#fff;padding:24px 6%}header div,main{max-width:950px;margin:auto}header div{display:flex;justify-content:space-between}a{color:inherit}main{padding:25px 18px}.panel{background:#fff;padding:20px;border-radius:12px}input{padding:10px;width:250px}button{padding:11px;background:#d71920;color:#fff;border:0;border-radius:7px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:11px;border-bottom:1px solid #ddd}.state{font-weight:bold}</style><link rel="stylesheet" href="sistema.css">
</head><body><header><div><div><h1>Estado de inscripción</h1><p>Consulta información actualizada por DNI.</p></div><a href="main.html">← Inicio</a></div></header><main><section class="panel"><form id="search"><input id="dni" placeholder="Ingresa tu DNI" required><button>Consultar</button></form><p id="message"></p><table><thead><tr><th>Convocatoria</th><th>Fecha</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>async function load(){const r=await fetch("/api/inscripciones"),b=await r.json();if(!r.ok)throw Error(b.error||"No se pudo consultar");return b}search.onsubmit=async e=>{e.preventDefault();try{const all=await load(),found=all.filter(x=>x.dni===dni.value.trim());rows.innerHTML=found.map(x=>`<tr><td>${x.convocatoria}</td><td>${x.fechaInscripcion}</td><td class="state">${x.estado}</td></tr>`).join("");message.textContent=found.length?`${found.length} inscripción(es) encontrada(s).`:"No existen inscripciones para ese DNI."}catch(x){message.textContent=x.message}};</script></body></html>
