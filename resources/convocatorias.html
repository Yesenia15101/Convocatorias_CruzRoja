<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convocatorias disponibles</title>
<style>:root{font-family:Arial,sans-serif;background:#f5f5f5;color:#292929}*{box-sizing:border-box}body{margin:0}header{background:#d71920;color:#fff;padding:25px 6%}header div{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}a{color:inherit}main{max-width:1100px;margin:25px auto;padding:0 18px}.filter,.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 12px #0001}.filter{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.filter label{flex:1;font-weight:bold}input{width:100%;padding:10px;margin-top:5px;border:1px solid #bbb;border-radius:7px}button{border:0;background:#d71920;color:#fff;padding:11px 15px;border-radius:7px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:20px}.card h2{color:#b51319}.tags span{display:inline-block;background:#eee;padding:5px 8px;margin:3px;border-radius:14px}.status{font-weight:bold;color:#17652b}.warning{color:#905f00}</style><link rel="stylesheet" href="sistema.css">
</head>
<body><header><div><div><h1>Convocatorias disponibles</h1><p>Información actualizada de servicios y requisitos</p></div><a href="/main.html" onclick="window.location.replace('/main.html');return false">← Volver directamente al inicio</a></div></header><main>
<section class="filter"><label>Filtrar según habilidad, especialidad o perfil<input id="profile" placeholder="Ej. primeros auxilios, RCP, comunicación"></label><button id="apply">Filtrar</button><button id="mine">Usar mi perfil</button></section><p id="message"></p><section id="cards" class="grid"></section>
</main><script>
async function req(url){const r=await fetch(url);const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||b.error||"No se pudo cargar");return b}
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
async function load(value=""){const data=await req(`/api/convocatorias/disponibles?perfil=${encodeURIComponent(value)}`);cards.innerHTML=data.length?data.map(c=>`<article class="card"><h2>${esc(c.nombre)}</h2><p>📅 ${c.fechaServicio} · 📍 ${esc(c.lugar)}</p><p>🕒 ${c.horarioDefinido?`${c.horaInicio}–${c.horaFinalizacion} (${c.duracionTotal})`:c.mensajeHorario}</p><div class="tags">${c.requisitos.map(r=>`<span>${esc(r)}</span>`).join("")}</div><p class="${c.minimoAlcanzado?"status":"warning"}">${esc(c.aviso)} · ${c.estado.replaceAll("_"," ")}</p><a href="inscripcion.html?convocatoria=${c.codigo}">Inscribirme</a></article>`).join(""):"No hay convocatorias que coincidan con el perfil.";message.textContent=`${data.length} convocatoria(s) encontrada(s).`}
apply.onclick=()=>load(profile.value).catch(x=>message.textContent=x.message);mine.onclick=async()=>{try{const p=await req("/api/perfiles/actual");profile.value=p.habilidades[0]||p.especialidad;await load(profile.value)}catch(x){message.textContent="Inicia sesión para usar tu perfil."}};load();
</script></body></html>
