<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil</title>
<style>:root{font-family:Arial,sans-serif;background:#f5f5f5}body{margin:0}header{background:#d71920;color:#fff;padding:24px 6%}header div,main{max-width:760px;margin:auto}header div{display:flex;justify-content:space-between;align-items:center}a{color:inherit}main{padding:25px 18px}.panel{background:#fff;padding:23px;border-radius:12px;box-shadow:0 3px 13px #0001}label{display:block;font-weight:bold;margin:13px 0}input,select{width:100%;padding:10px;margin-top:5px;box-sizing:border-box}button{padding:11px 18px;border:0;border-radius:7px;background:#d71920;color:#fff;font-weight:bold}</style><link rel="stylesheet" href="sistema.css">
</head>
<body><header><div><div><h1>Mi perfil de voluntariado</h1><p>Esta información se utiliza para recomendar convocatorias.</p></div><a href="main.html">← Inicio</a></div></header><main><p id="message"></p><form id="form" class="panel"><label>Nombre<input name="nombre" required></label><label>Nivel de formación<select name="nivelFormacion"><option>EN_FORMACION</option><option>GRADUADO</option></select></label><label>Especialidad<input name="especialidad" required></label><label>Habilidades separadas por comas<input name="habilidadesTexto" required></label><button>Guardar cambios</button></form></main>
<script>async function req(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||b.error||"Operación fallida");return b}async function load(){const p=await req("/api/perfiles/actual");form.nombre.value=p.nombre;form.nivelFormacion.value=p.nivelFormacion;form.especialidad.value=p.especialidad;form.habilidadesTexto.value=p.habilidades.join(", ")}form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));try{await req("/api/perfiles/actual",{method:"PUT",body:JSON.stringify({...d,habilidades:d.habilidadesTexto.split(",").map(x=>x.trim()).filter(Boolean)})});message.textContent="Perfil actualizado correctamente. Las recomendaciones usarán estos datos."}catch(x){message.textContent=x.message}};load().catch(x=>message.textContent=x.message);</script></body></html>
